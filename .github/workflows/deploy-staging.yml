name: Deploy SayaraForce Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sayaraforce-staging
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-sayaraforce-staging
  AZURE_WEBAPP_NAME: app-sayaraforce-staging

jobs:
  test-build-deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: sayaraforce-staging

    steps:
      - name: Check out the exact staging commit
        uses: actions/checkout@v4

      - name: Assert staging-only targets
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/staging" ]]
          [[ "$AZURE_RESOURCE_GROUP" == "rg-sayaraforce-staging" ]]
          [[ "$AZURE_WEBAPP_NAME" == "app-sayaraforce-staging" ]]
          [[ "$AZURE_WEBAPP_NAME" != "app-sayaraforce" ]]

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, curl, zip, xml
          coverage: none
          tools: composer:2.8.12

      - name: Prepare ephemeral test application key
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          : > .env
          test_key="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          printf 'APP_KEY=%s\n' "$test_key" >> "$GITHUB_ENV"
          unset test_key

      - name: Install test dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: PHP dependency and secret security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p storage/app/security
          composer validate --strict --no-interaction
          composer audit --locked --format=json | tee storage/app/security/composer-audit.json
          php ops/security/scan-secrets.php --json=storage/app/security/secret-scan.json

      - name: Validate canonical schema baseline
        shell: pwsh
        run: ./ops/azure/staging/validate-schema-baseline.ps1

      - name: PHP lint
        shell: bash
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Focused staging and WhatsApp tests
        run: php artisan test tests/Feature/SelfServiceWhatsAppOnboardingTest.php tests/Feature/StagingSafetyTest.php --no-ansi

      - name: Full automated suite
        run: php artisan test --no-ansi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm audit --json | tee storage/app/security/npm-audit.json
          php ops/security/generate-sbom.php --output=storage/app/security/sbom.cdx.json
          npm run build
          test -f public/build/manifest.json
          # Fable remediation (Phase 6): scan the built browser bundles for leaked secrets.
          php ops/security/scan-secrets.php --include-build --build-json=storage/app/security/secret-scan-build.json

      - name: Preserve security gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: sayaraforce-security-evidence-${{ github.sha }}
          path: storage/app/security/
          if-no-files-found: error
          retention-days: 90

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Remove ephemeral test environment file
        shell: bash
        run: |
          rm -f .env
          test ! -e .env

      - name: Package required runtime files only
        shell: bash
        run: |
          set -Eeuo pipefail
          package="$RUNNER_TEMP/sayaraforce-package"
          mkdir -p "$package/storage/framework/cache" "$package/storage/framework/sessions" "$package/storage/framework/views" "$package/storage/logs"
          for path in app bootstrap config database ops public resources/views routes vendor; do
            if [[ -e "$path" ]]; then
              mkdir -p "$package/$(dirname "$path")"
              cp -a "$path" "$package/$path"
            fi
          done
          cp artisan composer.json composer.lock "$package/"
          printf '%s\n' "$GITHUB_SHA" > "$package/bootstrap/deployed-commit"
          for job in sayaraforce-staging-postdeploy sayaraforce-staging-verify sayaraforce-staging-smoke sayaraforce-staging-history-uat sayaraforce-staging-quick-scan-uat; do
            target="$package/App_Data/jobs/triggered/$job"
            mkdir -p "$target"
            cp "ops/azure/staging/webjobs/$job/"* "$target/"
          done
          # Fable M1/M2 (final): security-maintenance is deployed as a CONTINUOUS
          # WebJob (see the migration step), NOT triggered, so it runs regardless
          # of WEBJOBS_DISABLE_SCHEDULE without enabling the outbound scheduler.
          # It is intentionally NOT packaged into the immutable release zip.
          (cd "$package" && zip -qr "$GITHUB_WORKSPACE/release.zip" .)
          unzip -l release.zip | grep -F 'public/build/manifest.json'
          unzip -l release.zip | grep -F 'ops/azure/staging/post-deploy.sh'
          unzip -p release.zip bootstrap/deployed-commit | grep -Fx "$GITHUB_SHA"
          unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-postdeploy/run.sh'
          unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-verify/run.sh'
          unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-smoke/run.php'
          unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-history-uat/run.sh'
          unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-quick-scan-uat/run.sh'
          # security-maintenance must NOT be packaged as a triggered job (it is a
          # continuous webjob deployed separately after migration).
          if unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-security-maintenance/'; then
            echo 'security-maintenance must be a continuous webjob, not triggered.' >&2
            exit 1
          fi
          # The continuous security-maintenance webjob must run ONLY the isolated
          # security:run-maintenance command and never the outbound scheduler.
          grep -F 'security:run-maintenance' ops/azure/staging/webjobs/sayaraforce-staging-security-maintenance/run.sh
          if grep -E 'schedule:(work|run)|send-reminders|journeys:tick' ops/azure/staging/webjobs/sayaraforce-staging-security-maintenance/run.sh; then
            echo 'security-maintenance webjob must not run any outbound/scheduler command.' >&2
            exit 1
          fi
          if unzip -l release.zip | grep -F 'App_Data/jobs/continuous/sayaraforce-staging-scheduler/'; then
            echo 'Staging scheduler must not be packaged during initial bring-up.' >&2
            exit 1
          fi
          if unzip -l release.zip | grep -F 'App_Data/jobs/continuous/sayaraforce-queue/'; then
            echo 'Production/general queue WebJob found in staging package.' >&2
            exit 1
          fi
          if unzip -l release.zip | grep -E '(^|/)(\.env|tests|node_modules|\.git)(/|$)'; then
            echo 'Unsafe file found in package.' >&2
            exit 1
          fi

      - name: Sign in to Azure with staging-only OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_STAGING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_STAGING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_STAGING_SUBSCRIPTION_ID }}

      - name: Verify Azure target identity
        shell: bash
        run: |
          set -Eeuo pipefail
          app_id="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query id --output tsv)"
          [[ "$app_id" == */resourceGroups/rg-sayaraforce-staging/providers/Microsoft.Web/sites/app-sayaraforce-staging ]]
          schema_ready="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query "[?name=='STAGING_SCHEMA_BASELINE_APPROVED'].value | [0]" --output tsv)"
          if [[ "$schema_ready" != "true" ]]; then
            echo 'Deployment blocked: the reviewed, data-free staging schema baseline is not approved.' >&2
            exit 1
          fi

      - name: Deploy package to staging only
        shell: bash
        run: |
          set -Eeuo pipefail
          # OneDeploy can occasionally leave a transient "Receiving changes"
          # receipt before accepting the immutable package. Retrying the same
          # ZIP is idempotent and remains constrained to the verified staging
          # resource above.
          deployed=false
          for attempt in {1..3}; do
            if az webapp deploy \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --src-path release.zip \
              --type zip --clean true --restart false --track-status false \
              --only-show-errors --output none; then
              deployed=true
              break
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Staging OneDeploy receipt failed on attempt ${attempt}; retrying the same package." >&2
              sleep $((attempt * 15))
            fi
          done

          if [[ "$deployed" != true ]]; then
            echo 'Staging OneDeploy did not accept the immutable release package after three attempts.' >&2
            exit 1
          fi

      - name: Run staging migration and cache rebuild
        shell: bash
        run: |
          set -Eeuo pipefail
          token="$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)"
          kudu="https://${AZURE_WEBAPP_NAME}.scm.azurewebsites.net"
          job='sayaraforce-staging-postdeploy'
          # Linux App Service can need more than two minutes to restart the
          # continuous WebJob after a full package replacement.
          for attempt in {1..60}; do
            if curl --fail --silent --show-error -H "Authorization: Bearer $token" "$kudu/api/triggeredwebjobs" \
              | jq -e --arg job "$job" 'any(.[]; .name == $job)' >/dev/null; then
              break
            fi
            sleep 5
          done
          curl --fail --silent --show-error -H "Authorization: Bearer $token" "$kudu/api/triggeredwebjobs" \
            | jq -e --arg job "$job" 'any(.[]; .name == $job)' >/dev/null

          history="$RUNNER_TEMP/postdeploy-history.json"
          history_status="$(curl --silent --show-error -H "Authorization: Bearer $token" \
            --output "$history" --write-out '%{http_code}' \
            "$kudu/api/triggeredwebjobs/$job/history")"
          if [[ "$history_status" == '404' ]]; then
            printf '{"runs":[]}\n' > "$history"
          elif [[ "$history_status" != '200' ]]; then
            echo "Unable to read the staging post-deploy WebJob history (HTTP $history_status)." >&2
            exit 1
          fi
          previous_id="$(jq -r '.runs[0].id // ""' "$history")"
          subscription_id="$(az account show --query id --output tsv)"
          az rest --method post --uri \
            "https://management.azure.com/subscriptions/$subscription_id/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/$AZURE_WEBAPP_NAME/triggeredwebjobs/$job/run?api-version=2024-11-01" \
            --output none

          run_status=''
          output_url=''
          for attempt in {1..120}; do
            sleep 5
            curl --fail --silent --show-error -H "Authorization: Bearer $token" \
              "$kudu/api/triggeredwebjobs/$job/history" > "$history"
            run_id="$(jq -r '.runs[0].id // ""' "$history")"
            run_status="$(jq -r '.runs[0].status // ""' "$history")"
            if [[ -n "$run_id" && "$run_id" != "$previous_id" && "$run_status" != 'Running' && "$run_status" != 'Initializing' ]]; then
              output_url="$(jq -r '.runs[0].output_url // ""' "$history")"
              break
            fi
          done
          [[ "$run_status" == 'Success' && -n "$output_url" ]]
          postdeploy_output="$RUNNER_TEMP/postdeploy-output.log"
          curl --fail --silent --show-error -H "Authorization: Bearer $token" "$output_url" > "$postdeploy_output"
          grep -F 'Schema fingerprint matches the approved canonical schema.' "$postdeploy_output"
          grep -F 'Staging migration, commercial catalogue bootstrap, and Laravel cache rebuild completed without reseeding operational data.' "$postdeploy_output"

          queue_job_zip="$RUNNER_TEMP/sayaraforce-staging-queue.zip"
          (
            cd ops/azure/staging/webjobs/sayaraforce-staging-queue
            zip -q "$queue_job_zip" run.sh settings.job
          )
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/zip' \
            --data-binary "@$queue_job_zip" \
            "$kudu/api/zip/site/wwwroot/App_Data/jobs/continuous/sayaraforce-staging-queue/" >/dev/null

          # Fable M1/M2 (final): deploy security-maintenance as a CONTINUOUS
          # webjob AFTER migration so retention/grace enforcement runs
          # automatically (unaffected by WEBJOBS_DISABLE_SCHEDULE) without the
          # general outbound scheduler.
          sm_job_zip="$RUNNER_TEMP/sayaraforce-staging-security-maintenance.zip"
          (
            cd ops/azure/staging/webjobs/sayaraforce-staging-security-maintenance
            zip -q "$sm_job_zip" run.sh settings.job
          )
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/zip' \
            --data-binary "@$sm_job_zip" \
            "$kudu/api/zip/site/wwwroot/App_Data/jobs/continuous/sayaraforce-staging-security-maintenance/" >/dev/null
          unset token

      - name: Record deployed build marker on staging
        shell: bash
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings DEPLOYED_BRANCH=staging DEPLOYED_COMMIT="$GITHUB_SHA" DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --only-show-errors --output none

      - name: Restart staging and verify health
        shell: bash
        run: |
          set -Eeuo pipefail
          host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)"
          kudu="https://${AZURE_WEBAPP_NAME}.scm.azurewebsites.net"
          token="$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)"

          # OneDeploy already restarts the app to pick up the new release, so this
          # explicit restart is redundant belt-and-suspenders. Keep it best-effort:
          # the least-privilege staging identity is intentionally not granted
          # Microsoft.Web/sites/restart/action, and the /healthz gate below is the
          # authoritative verification. Do not fail an otherwise-healthy deploy on a
          # missing restart permission, and do not broaden the role.
          if ! az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --only-show-errors 2>/tmp/restart.err; then
            echo "Note: explicit app restart was not authorized/necessary; relying on the deploy-time restart and the /healthz gate." >&2
          fi

          for attempt in {1..48}; do
            if curl --fail --silent --show-error --max-time 20 "https://$host/healthz" >/dev/null; then
              break
            fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 20 "https://$host/healthz" >/dev/null

          # Verify (and, if needed, start) the continuous webjobs through the Kudu
          # SCM API authenticated with the ARM bearer token — the SAME mechanism
          # already used to deploy them earlier in this workflow. This avoids the
          # Microsoft.Web/sites/continuouswebjobs ARM operations (list/start) that
          # the least-privilege staging identity is not granted, without adding any
          # permission. `az webapp webjob continuous list/start` was the source of
          # the post-deploy "Unauthorized" verifier failure.
          verify_continuous_webjob() {
            local name="$1" label="$2" status=''
            for attempt in {1..24}; do
              status="$(curl --fail --silent --show-error -H "Authorization: Bearer $token" "$kudu/api/continuouswebjobs" \
                | jq -r --arg n "$name" 'map(select(.name | contains($n))) | .[0].status // ""')" || status=''
              if [[ "$status" == 'Running' ]]; then
                return 0
              fi
              if [[ "$attempt" -eq 1 && "$status" != 'Initializing' && "$status" != 'PendingRestart' ]]; then
                curl --fail --silent --show-error -X POST -H "Authorization: Bearer $token" \
                  "$kudu/api/continuouswebjobs/$name/start" >/dev/null || true
              fi
              sleep 5
            done
            echo "Staging $label WebJob did not reach Running after deployment (status: ${status:-missing})." >&2
            return 1
          }

          verify_continuous_webjob 'sayaraforce-staging-queue' 'queue'
          # Fable M1/M2 (final): the continuous security-maintenance webjob must
          # also reach Running so retention/grace enforcement executes automatically.
          verify_continuous_webjob 'sayaraforce-staging-security-maintenance' 'security-maintenance'
          unset token

      - name: Azure logout
        if: always()
        run: az account show >/dev/null 2>&1 && az logout || true
