name: Deploy SayaraForce Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sayaraforce-staging
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-sayaraforce-staging
  AZURE_WEBAPP_NAME: app-sayaraforce-staging

jobs:
  test-build-deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: sayaraforce-staging

    steps:
      - name: Check out the exact staging commit
        uses: actions/checkout@v4

      - name: Assert staging-only targets
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/staging" ]]
          [[ "$AZURE_RESOURCE_GROUP" == "rg-sayaraforce-staging" ]]
          [[ "$AZURE_WEBAPP_NAME" == "app-sayaraforce-staging" ]]
          [[ "$AZURE_WEBAPP_NAME" != "app-sayaraforce" ]]

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, curl, zip, xml
          coverage: none

      - name: Install test dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Prepare ephemeral test application key
        shell: bash
        run: |
          set -Eeuo pipefail
          : > .env
          test_key="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          printf 'APP_KEY=%s\n' "$test_key" >> "$GITHUB_ENV"
          unset test_key

      - name: Validate canonical schema baseline
        shell: pwsh
        run: ./ops/azure/staging/validate-schema-baseline.ps1

      - name: PHP lint
        shell: bash
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Focused staging and WhatsApp tests
        run: php artisan test tests/Feature/SelfServiceWhatsAppOnboardingTest.php tests/Feature/StagingSafetyTest.php --no-ansi

      - name: Full automated suite
        run: php artisan test --no-ansi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Remove ephemeral test environment file
        shell: bash
        run: |
          rm -f .env
          test ! -e .env

      - name: Package required runtime files only
        shell: bash
        run: |
          set -Eeuo pipefail
          package="$RUNNER_TEMP/sayaraforce-package"
          mkdir -p "$package/storage/framework/cache" "$package/storage/framework/sessions" "$package/storage/framework/views" "$package/storage/logs"
          for path in app bootstrap config database ops public resources/views routes vendor; do
            if [[ -e "$path" ]]; then
              mkdir -p "$package/$(dirname "$path")"
              cp -a "$path" "$package/$path"
            fi
          done
          cp artisan composer.json composer.lock "$package/"
          for job in sayaraforce-staging-postdeploy sayaraforce-staging-verify sayaraforce-staging-smoke; do
            target="$package/App_Data/jobs/triggered/$job"
            mkdir -p "$target"
            cp "ops/azure/staging/webjobs/$job/"* "$target/"
          done
          (cd "$package" && zip -qr "$GITHUB_WORKSPACE/release.zip" .)
          unzip -l release.zip | grep -F 'public/build/manifest.json'
          unzip -l release.zip | grep -F 'ops/azure/staging/post-deploy.sh'
          unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-postdeploy/run.sh'
          unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-verify/run.sh'
          unzip -l release.zip | grep -F 'App_Data/jobs/triggered/sayaraforce-staging-smoke/run.php'
          if unzip -l release.zip | grep -F 'App_Data/jobs/continuous/sayaraforce-staging-scheduler/'; then
            echo 'Staging scheduler must not be packaged during initial bring-up.' >&2
            exit 1
          fi
          if unzip -l release.zip | grep -F 'App_Data/jobs/continuous/sayaraforce-queue/'; then
            echo 'Production/general queue WebJob found in staging package.' >&2
            exit 1
          fi
          if unzip -l release.zip | grep -E '(^|/)(\.env|tests|node_modules|\.git)(/|$)'; then
            echo 'Unsafe file found in package.' >&2
            exit 1
          fi

      - name: Sign in to Azure with staging-only OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_STAGING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_STAGING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_STAGING_SUBSCRIPTION_ID }}

      - name: Verify Azure target identity
        shell: bash
        run: |
          set -Eeuo pipefail
          app_id="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query id --output tsv)"
          [[ "$app_id" == */resourceGroups/rg-sayaraforce-staging/providers/Microsoft.Web/sites/app-sayaraforce-staging ]]
          schema_ready="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query "[?name=='STAGING_SCHEMA_BASELINE_APPROVED'].value | [0]" --output tsv)"
          if [[ "$schema_ready" != "true" ]]; then
            echo 'Deployment blocked: the reviewed, data-free staging schema baseline is not approved.' >&2
            exit 1
          fi

      - name: Deploy package to staging only
        shell: bash
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path release.zip \
            --type zip --clean true --restart false --track-status true \
            --only-show-errors --output none

      - name: Run staging migration and cache rebuild
        shell: bash
        run: |
          set -Eeuo pipefail
          token="$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)"
          kudu="https://${AZURE_WEBAPP_NAME}.scm.azurewebsites.net"
          job='sayaraforce-staging-postdeploy'
          for attempt in {1..24}; do
            if curl --fail --silent --show-error -H "Authorization: Bearer $token" "$kudu/api/triggeredwebjobs" \
              | jq -e --arg job "$job" 'any(.[]; .name == $job)' >/dev/null; then
              break
            fi
            sleep 5
          done
          curl --fail --silent --show-error -H "Authorization: Bearer $token" "$kudu/api/triggeredwebjobs" \
            | jq -e --arg job "$job" 'any(.[]; .name == $job)' >/dev/null

          history="$RUNNER_TEMP/postdeploy-history.json"
          history_status="$(curl --silent --show-error -H "Authorization: Bearer $token" \
            --output "$history" --write-out '%{http_code}' \
            "$kudu/api/triggeredwebjobs/$job/history")"
          if [[ "$history_status" == '404' ]]; then
            printf '{"runs":[]}\n' > "$history"
          elif [[ "$history_status" != '200' ]]; then
            echo "Unable to read the staging post-deploy WebJob history (HTTP $history_status)." >&2
            exit 1
          fi
          previous_id="$(jq -r '.runs[0].id // ""' "$history")"
          subscription_id="$(az account show --query id --output tsv)"
          az rest --method post --uri \
            "https://management.azure.com/subscriptions/$subscription_id/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/$AZURE_WEBAPP_NAME/triggeredwebjobs/$job/run?api-version=2024-11-01" \
            --output none

          run_status=''
          output_url=''
          for attempt in {1..120}; do
            sleep 5
            curl --fail --silent --show-error -H "Authorization: Bearer $token" \
              "$kudu/api/triggeredwebjobs/$job/history" > "$history"
            run_id="$(jq -r '.runs[0].id // ""' "$history")"
            run_status="$(jq -r '.runs[0].status // ""' "$history")"
            if [[ -n "$run_id" && "$run_id" != "$previous_id" && "$run_status" != 'Running' && "$run_status" != 'Initializing' ]]; then
              output_url="$(jq -r '.runs[0].output_url // ""' "$history")"
              break
            fi
          done
          [[ "$run_status" == 'Success' && -n "$output_url" ]]
          postdeploy_output="$RUNNER_TEMP/postdeploy-output.log"
          curl --fail --silent --show-error -H "Authorization: Bearer $token" "$output_url" > "$postdeploy_output"
          grep -F 'Schema fingerprint matches the approved canonical schema.' "$postdeploy_output"
          grep -F 'Staging migration and Laravel cache rebuild completed.' "$postdeploy_output"

          mkdir_response="$RUNNER_TEMP/kudu-mkdir.json"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data '{"command":"mkdir -p App_Data/jobs/continuous/sayaraforce-staging-queue","dir":"/home/site/wwwroot"}' \
            "$kudu/api/command" > "$mkdir_response"
          [[ "$(jq -r '.ExitCode' "$mkdir_response")" == '0' ]]
          for file in run.sh settings.job; do
            curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $token" -H 'If-Match: *' -H 'Content-Type: application/octet-stream' \
              --data-binary "@ops/azure/staging/webjobs/sayaraforce-staging-queue/$file" \
              "$kudu/api/vfs/site/wwwroot/App_Data/jobs/continuous/sayaraforce-staging-queue/$file" >/dev/null
          done
          unset token

      - name: Record successful deployment marker on staging
        shell: bash
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings DEPLOYED_BRANCH=staging DEPLOYED_COMMIT="$GITHUB_SHA" DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --only-show-errors --output none

      - name: Restart staging and verify health
        shell: bash
        run: |
          set -Eeuo pipefail
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --only-show-errors
          host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)"
          for attempt in {1..48}; do
            if curl --fail --silent --show-error --max-time 20 "https://$host/healthz" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Azure logout
        if: always()
        run: az logout
